<script>
const LOOP = 8, BEATS = 16, BASE = 120;  // every loop: 8 s = 16 beats at 120 BPM
const dots = [...document.querySelectorAll('#dots i')], visible = new Set();
const out = document.getElementById('bpm'), slider = document.getElementById('slider');
const tap = document.getElementById('tap'), half = document.getElementById('half');
let bpm = 120, rate = 1, beat = 0, last = performance.now(), taps = [];
const speed = () => bpm * rate / BASE;
function setBpm(v) { bpm = Math.max(70, Math.min(180, Math.round(v))); out.textContent = bpm; slider.value = bpm; retime(); }
function retime() { for (const v of visible) v.playbackRate = speed(); }
slider.oninput = () => setBpm(+slider.value);
half.onclick = () => { rate = rate === 1 ? .5 : rate === .5 ? 2 : 1; half.textContent = '×' + rate; retime(); };
tap.onclick = () => {
  const now = performance.now(); taps = taps.filter(t => now - t < 2500); taps.push(now);
  tap.classList.add('hit'); setTimeout(() => tap.classList.remove('hit'), 80);
  if (taps.length > 1) setBpm(60000 * (taps.length - 1) / (now - taps[0]));
  beat = Math.round(beat);  // a tap lands on the beat
};
// Where every loop should be right now, in seconds of its own 8 s.
const target = () => (beat % BEATS) / BEATS * LOOP;
function sync(v) {
  if (!v.src.startsWith('blob:') || v.seeking) return;
  let d = v.currentTime - target(); d -= LOOP * Math.round(d / LOOP);
  if (Math.abs(d) > .15) v.currentTime = target();
}
// Previews are ~150 KB, so each is fetched whole into a blob: seeking then works on any static host,
// even one that ignores range requests (which would otherwise snap every resync back to 0).
async function load(v) {
  if (v.dataset.loading) return; v.dataset.loading = 1;
  const blob = await (await fetch(v.dataset.src)).blob();
  v.src = URL.createObjectURL(blob);
  await new Promise(r => v.addEventListener('loadedmetadata', r, { once: true }));
  if (visible.has(v)) start(v);
}
function start(v) { v.playbackRate = speed(); sync(v); v.play().catch(() => {}); }
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    const v = e.target;
    if (e.isIntersecting) { visible.add(v); v.src.startsWith('blob:') ? start(v) : load(v); }
    else { visible.delete(v); v.pause(); }
  }
}, { rootMargin: '200px' });
document.querySelectorAll('video').forEach(v => io.observe(v));
setInterval(() => visible.forEach(sync), 500);
function tick(now) {
  beat += (now - last) * bpm * rate / 60000; last = now;
  dots.forEach((d, i) => d.classList.toggle('on', Math.floor(beat) % 4 === i));
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
